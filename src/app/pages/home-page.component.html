<div class="page-root">
  <main class="page-main">
    <app-scroll-progress></app-scroll-progress>

    <div class="hero-atmosphere" aria-hidden="true">
      <app-strands-hero-bg [active]="decorativeEffectsReady() && heroSection.isNear()" />
    </div>

    <section appSectionActivity #heroSection="sectionActivity" class="hero-section">
      <div class="hero-content">
        <div class="hero-content__inner hero-reveal">
          <h1 class="hero-title hero-reveal hero-reveal-delay-1">
            <span class="hero-title__lead">Unlock Your</span>
            <span class="gradient-text">Operational Intelligence</span>
          </h1>

          <p class="hero-subtitle hero-reveal hero-reveal-delay-2">
            Klogdata designs and engineers custom web apps, digital products, and scalable websites tailored to the unique demands of your industry.
          </p>
        </div>
      </div>
    </section>

    <!-- Sits at the bottom of the first viewport; sticks to top once scrolled there -->
    <app-navbar (consultationRequested)="openConsultation()"></app-navbar>

    @defer (when deferredSectionsReady()) {
      <app-home-deferred-sections
        [ctaImageReady]="overlayDetailsReady()"
        [decorativeEffectsReady]="decorativeEffectsReady()"
        [isSmallScreen]="isSmallScreen()"
        [overlayDetailsReady]="overlayDetailsReady()"
        (consultationRequested)="openConsultation()"
      ></app-home-deferred-sections>
    }

    <div appSectionActivity #footerTrigger="sectionActivity" class="section-trigger" aria-hidden="true"></div>

    @defer (when footerTrigger.hasEntered()) {
      <app-footer></app-footer>
    }
  </main>

  <ng-template #consultationOutlet></ng-template>

  <app-toast-host></app-toast-host>
</div>
