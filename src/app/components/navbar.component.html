<header
  class="navbar"
  [ngClass]="{ 'navbar--scrolled': scrolled() }"
>
  <div class="navbar__container">
    <button
      type="button"
      (click)="scrollToTop()"
      class="navbar__logo"
    >
      <div class="navbar__logo-icon">
        <img [src]="logoSrc" alt="Klogdata Logo" />
      </div>
      <span class="brand-wordmark text-xl font-bold" style="font-family: 'Outfit', sans-serif">Klog<span class="brand-wordmark-accent">data</span>.</span>
    </button>

    <nav class="navbar__desktop-nav">
      @for (link of navLinks; track link.name) {
        <button
          type="button"
          (click)="handleNavClick(link.href)"
          class="navbar__nav-link"
        >
          {{ link.name }}
          <div class="navbar__nav-link-underline"></div>
        </button>
      }

      <button type="button" (click)="openConsultation()" class="navbar__cta-btn">
        Schedule a Consultation
      </button>
    </nav>

    <button
      type="button"
      class="navbar__mobile-toggle"
      (click)="toggleMobileMenu()"
    >
      <lucide-icon [img]="mobileMenuOpen() ? icons.X : icons.Menu" class="h-6 w-6"></lucide-icon>
    </button>
  </div>

  @if (mobileMenuMounted()) {
    <div
      class="navbar__mobile-menu"
      [ngClass]="mobileMenuOpen() ? 'navbar__mobile-menu--open' : 'navbar__mobile-menu--closed'"
    >
      <div class="navbar__mobile-links">
        @for (link of navLinks; track link.name) {
          <button
            type="button"
            (click)="handleNavClick(link.href)"
            class="navbar__mobile-link"
          >
            {{ link.name }}
          </button>
        }

        <button
          type="button"
          (click)="handleMobileConsultation()"
          class="navbar__cta-btn navbar__mobile-cta"
        >
          Schedule a Consultation
        </button>
      </div>
    </div>
  }
</header>
